[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragdoc-mcp"
version = "0.1.0"
description = "RAG Doctor: a local-first MCP server that finds which stage of a RAG pipeline failed (parse, chunk, index, retrieve, rerank, pack) and verifies the fix."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["mcp", "rag", "retrieval", "debugging", "evaluation", "model-context-protocol"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Debuggers",
]
dependencies = [
  "mcp>=2.3,<3",
  "lancedb>=0.40",
  "pydantic>=2.6",
  "pypdf>=5",
  "numpy>=1.26",
  "pyarrow>=15",
]

[project.optional-dependencies]
neural = ["fastembed>=0.4"]
docling = ["docling>=2"]
dev = ["pytest>=8", "ruff>=0.5", "reportlab>=4", "pillow>=10", "pip-audit"]

[project.scripts]
ragdoc-mcp = "ragdoc.__main__:main"

[project.urls]
Homepage = "https://github.com/YOUR-USER/ragdoc-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/ragdoc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"
[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["E501", "B008", "B905", "E731"]
